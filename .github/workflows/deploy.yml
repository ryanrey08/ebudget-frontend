name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a manual "Run workflow" button

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: check # only deploy if type check and tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/ebudget-frontend
            git fetch origin main
            git reset --hard origin/main
            docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker image prune -f
            docker compose ps
